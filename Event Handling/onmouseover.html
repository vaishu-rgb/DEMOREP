<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>onmouseover Example</title>
  <script>
    function mouseOverEffect(x) {
      x.style.color = "red";
    }
  </script>
</head>
<body>
  <h2>onmouseover Event</h2>
  <p onmouseover="mouseOverEffect(this)">Move your mouse over this text.</p>
</body>
</html>
