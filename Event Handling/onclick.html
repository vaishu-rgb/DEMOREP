<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>onclick Example</title>
  <script>
    function handleClick() {
      alert("Button clicked successfully!");
    }
  </script>
</head>
<body>
  <h2>onclick Event</h2>
  <button onclick="handleClick()">Click Me</button>
</body>
</html>
