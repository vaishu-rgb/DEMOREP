<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>onload Example</title>
  <script>
    function pageLoaded() {
      alert("Page finished loading!");
    }
  </script>
</head>
<body onload="pageLoaded()">
  <h2>onload Event</h2>
  <p>This message appears when the page has fully loaded.</p>
</body>
</html>
