<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>onmouseout Example</title>
  <script>
    function mouseOutEffect(x) {
      x.style.color = "blue";
    }
  </script>
</head>
<body>
  <h2>onmouseout Event</h2>
  <p onmouseout="mouseOutEffect(this)">Move your mouse away from this text.</p>
</body>
</html>
