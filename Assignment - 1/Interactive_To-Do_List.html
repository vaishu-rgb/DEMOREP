<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive To-Do List</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Style for completed tasks */
    .completed {
      text-decoration: line-through;
      opacity: 0.6;
      color: #6c757d; /* muted gray */
      background-color: #f8f9fa;
    }
  </style>
</head>
<body class="bg-light">

  <main class="container py-5">
    <h1 class="mb-4">Interactive To-Do List</h1>

    <!-- Input form -->
    <form id="taskForm" class="input-group mb-3">
      <input id="taskInput" type="text" class="form-control" placeholder="Add a new task...">
      <button class="btn btn-primary" type="submit">Add</button>
    </form>

    <!-- Task list -->
    <ul id="taskList" class="list-group"></ul>
  </main>

  <script>
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');

    // Add task
    function addTask(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      const li = document.createElement('li');
      li.className = "list-group-item d-flex align-items-center justify-content-between";

      // Checkbox
      const checkbox = document.createElement('input');
      checkbox.type = "checkbox";
      checkbox.className = "form-check-input me-2";

      // Task text
      const span = document.createElement('span');
      span.textContent = trimmed;
      span.className = "flex-grow-1";

      // Toggle completion when clicking checkbox
      checkbox.onchange = () => {
        li.classList.toggle('completed', checkbox.checked);
      };

      // Delete button
      const delBtn = document.createElement('button');
      delBtn.textContent = "Delete";
      delBtn.className = "btn btn-sm btn-danger ms-2";
      delBtn.onclick = () => li.remove();

      li.append(checkbox, span, delBtn);
      taskList.appendChild(li);
    }

    // Handle form submit (Add or Enter key)
    taskForm.addEventListener('submit', e => {
      e.preventDefault();
      addTask(taskInput.value);
      taskInput.value = "";
      taskInput.focus();
    });
  </script>
</body>
</html>
