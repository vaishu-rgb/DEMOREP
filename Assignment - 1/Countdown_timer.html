<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown Timer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .timer-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0px 6px 16px rgba(0,0,0,0.25);
      max-width: 700px;
      width: 100%;
    }

    h1 {
      font-weight: 700;
      background: linear-gradient(45deg, #2575fc, #6a11cb);
      
      -webkit-text-fill-color: "";
    }

    .time-value {
      font-size: 3.5rem;
      font-weight: 800;
      color: #2575fc;
    }

    .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #666;
      letter-spacing: 1px;
    }

    .btn-custom {
      border-radius: 30px;
      padding: 0.5rem 1.5rem;
      font-weight: 600;
    }

    #status {
      font-style: italic;
    }

    @media (max-width: 576px) {
      .time-value { font-size: 2.2rem !important; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="timer-box text-center">
      <h1 class="mb-4">Countdown Timer</h1>

      <!-- Controls -->
      <div class="d-flex flex-column flex-md-row gap-2 justify-content-center align-items-stretch mb-4">
        <input id="targetTime" type="datetime-local" class="form-control"
               aria-label="Target date and time"/>
        <div class="d-flex gap-2">
          <button id="startBtn" class="btn btn-primary btn-custom">Start</button>
          <button id="pauseBtn" class="btn btn-outline-secondary btn-custom">Pause</button>
          <button id="resetBtn" class="btn btn-outline-danger btn-custom">Reset</button>
        </div>
      </div>

      <!-- Timer Display -->
      <div class="d-flex flex-wrap justify-content-center gap-4 text-center mb-3">
        <div>
          <div id="days" class="time-value">00</div>
          <div class="label">Days</div>
        </div>
        <div>
          <div id="hours" class="time-value">00</div>
          <div class="label">Hours</div>
        </div>
        <div>
          <div id="mins" class="time-value">00</div>
          <div class="label">Minutes</div>
        </div>
        <div>
          <div id="secs" class="time-value">00</div>
          <div class="label">Seconds</div>
        </div>
      </div>
      <p id="status" class="text-center text-secondary"></p>
      <p class="text-muted small">Tip: Pick a target date/time above and hit <strong>Start</strong>.</p>
    </div>
  </div>

  <script>
    const daysEl  = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minsEl  = document.getElementById('mins');
    const secsEl  = document.getElementById('secs');
    const statusEl= document.getElementById('status');

    const targetInput = document.getElementById('targetTime');
    const startBtn    = document.getElementById('startBtn');
    const pauseBtn    = document.getElementById('pauseBtn');
    const resetBtn    = document.getElementById('resetBtn');

    let targetTs = null;
    let timerId  = null;
    let paused   = false;

    (function setDefaultTarget(){
      const now = new Date();
      const in10 = new Date(now.getTime() + 10 * 60 * 1000);
      targetInput.value = in10.toISOString().slice(0,16);
      targetTs = in10.getTime();
      update();
    })();

    function pad(n){ return String(n).padStart(2,'0'); }

    function renderDiff(diffMs){
      if (diffMs < 0) diffMs = 0;
      const totalSec = Math.floor(diffMs / 1000);
      const d = Math.floor(totalSec / (24 * 3600));
      const h = Math.floor((totalSec % (24 * 3600)) / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;

      daysEl.textContent  = pad(d);
      hoursEl.textContent = pad(h);
      minsEl.textContent  = pad(m);
      secsEl.textContent  = pad(s);
    }

    function update(){
      if (targetTs == null) return;
      const now = Date.now();
      const diff = targetTs - now;
      renderDiff(diff);

      if (diff <= 0){
        clearInterval(timerId);
        timerId = null;
        statusEl.textContent = '⏰ Time’s up!';
      } else if (!paused){
        statusEl.textContent = '';
      }
    }

    function start(){
      const picked = new Date(targetInput.value);
      if (isNaN(picked.getTime())){
        statusEl.textContent = 'Please pick a valid date and time.';
        return;
      }
      targetTs = picked.getTime();

      paused = false;
      clearInterval(timerId);
      update();
      timerId = setInterval(update, 1000);
    }

    function pause(){
      if (!timerId) return;
      paused = true;
      clearInterval(timerId);
      timerId = null;
      statusEl.textContent = '⏸️ Paused';
    }

    function reset(){
      clearInterval(timerId);
      timerId = null;
      paused = false;
      renderDiff(0);
      statusEl.textContent = '🔄 Reset';
    }

    startBtn.addEventListener('click', start);
    pauseBtn.addEventListener('click', pause);
    resetBtn.addEventListener('click', reset);
  </script>
</body>
</html>
